<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brettspiel-Kalender</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 20px;
            background-color: #f9f9f9;
        }
        h1 {
            color: #333;
            text-align: center;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: #fff;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
            color: #333;
            font-weight: bold;
        }
        tr:nth-child(even) {
            background-color: #fafafa;
        }
        tr:hover {
            background-color: #f1f1f1;
        }
        .event-link {
            color: #0066cc;
            text-decoration: none;
            font-weight: bold;
        }
        .event-link:hover {
            text-decoration: underline;
        }
        .no-events {
            text-align: center;
            padding: 20px;
            color: #666;
        }
    </style>
</head>
<body>

    <h1>Kommende Brettspiel-Events</h1>

    <table id="events-table">
        <thead>
            <tr>
                <th>Beginn</th>
                <th>Ende</th>
                <th>Event</th>
                <th>Ort</th>
                <th>Beschreibung</th>
            </tr>
        </thead>
        <tbody id="events-body">
            <tr>
                <td colspan="5" class="no-events">Daten werden geladen...</td>
            </tr>
        </tbody>
    </table>

    <script>
        fetch('events.json')
            .then(response => {
                if (!response.ok) {
                    throw new Error('Netzwerkfehler beim Laden der JSON-Datei');
                }
                return response.json();
            })
            .then(events => {
                const tbody = document.getElementById('events-body');
                tbody.innerHTML = '';

                // Aktuelles Datum im Format YYYY-MM-DD
                const heute = new Date().toISOString().split('T')[0];

                // Filtern: Nur Events, deren Enddatum heute oder in der Zukunft liegt
                const aktuelleEvents = events.filter(event => event.ende_datum >= heute);

                // Sortieren: Chronologisch aufsteigend nach Startdatum
                aktuelleEvents.sort((a, b) => {
                    if (a.start_datum === b.start_datum) {
                        return a.start_zeit.localeCompare(b.start_zeit);
                    }
                    return a.start_datum.localeCompare(b.start_datum);
                });

                if (aktuelleEvents.length > 0) {
                    aktuelleEvents.forEach(event => {
                        // Datumsformate konvertieren (YYYY-MM-DD zu DD.MM.YYYY)
                        const startParts = event.start_datum.split('-');
                        const formatiertesStartDatum = `${startParts[2]}.${startParts[1]}.${startParts[0]}`;

                        const endeParts = event.ende_datum.split('-');
                        const formatiertesEndeDatum = `${endeParts[2]}.${endeParts[1]}.${endeParts[0]}`;

                        // Titel-Link generieren falls URL vorhanden
                        let titelSpalte = escapeHtml(event.titel);
                        if (event.url && event.url.trim() !== "") {
                            titelSpalte = `<a href="${encodeURI(event.url)}" class="event-link" target="_blank" rel="noopener noreferrer">${escapeHtml(event.titel)}</a>`;
                        }

                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td>${escapeHtml(formatiertesStartDatum)}<br><small>${escapeHtml(event.start_zeit)} Uhr</small></td>
                            <td>${escapeHtml(formatiertesEndeDatum)}<br><small>${escapeHtml(event.ende_zeit)} Uhr</small></td>
                            <td>${titelSpalte}</td>
                            <td>${escapeHtml(event.ort)}</td>
                            <td>${escapeHtml(event.beschreibung)}</td>
                        `;
                        tbody.appendChild(tr);
                    });
                } else {
                    tbody.innerHTML = "<tr><td colspan='5' class='no-events'>Keine kommenden Events geplant.</td></tr>";
                }
            })
            .catch(error => {
                console.error('Fehler:', error);
                document.getElementById('events-body').innerHTML = 
                    "<tr><td colspan='5' class='no-events'>Fehler beim Laden der Events.</td></tr>";
            });

        function escapeHtml(string) {
            return String(string).replace(/[&<>"']/g, function (s) {
                const entityMap = {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#39;'
                };
                return entityMap[s];
            });
        }
    </script>
</body>
</html>
