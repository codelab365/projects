<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brettspiel-Budget</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  body { font-family:'Inter',sans-serif; background:#f6f5fb; }
  .focus-ring:focus{ outline:none; box-shadow:0 0 0 3px rgba(109,40,217,.25); }
  input:disabled{ background:#f3f4f6; color:#6b7280; }
  .badge-ok{ background:#dcfce7; color:#166534; }
  .badge-warn{ background:#fef3c7; color:#92400e; }
  .badge-bad{ background:#fee2e2; color:#991b1b; }
</style>
</head>
<body class="text-gray-800">

<div class="container mx-auto p-4 md:p-8 max-w-5xl">

  <header class="text-center mb-8 md:mb-10">
    <h1 class="text-4xl md:text-5xl font-extrabold text-violet-800">🎲 Brettspiel-Budget</h1>
    <p class="text-gray-600 mt-2 text-lg">Gezielt einkaufen statt spontan kaufen</p>
  </header>

  <main class="space-y-8">

    <!-- Saldo-Übersicht -->
    <div class="bg-white p-6 rounded-xl shadow-lg">
      <div class="grid grid-cols-1 md:grid-cols-4 gap-4 text-center">
        <div>
          <p class="text-sm text-gray-500">Budget bisher gesamt</p>
          <p id="statTotalBudget" class="text-2xl font-bold text-gray-700">–</p>
        </div>
        <div>
          <p class="text-sm text-gray-500">Ausgegeben gesamt</p>
          <p id="statTotalSpent" class="text-2xl font-bold text-gray-700">–</p>
        </div>
        <div>
          <p class="text-sm text-gray-500">Aktueller Monat</p>
          <p id="statCurrentMonth" class="text-2xl font-bold text-gray-700">–</p>
        </div>
        <div>
          <p class="text-sm text-gray-500">Verfügbarer Saldo</p>
          <p id="statBalance" class="text-3xl font-extrabold">–</p>
        </div>
      </div>
      <div class="mt-4 pt-4 border-t border-gray-200 flex flex-wrap items-center justify-between gap-3">
        <div class="flex items-center gap-2 text-sm text-gray-600">
          <label for="startMonthInput">Startmonat der Regelung:</label>
          <input type="month" id="startMonthInput" class="border border-gray-300 rounded px-2 py-1 focus-ring">
          <label for="monthlyBudgetInput" class="ml-3">Monatsbudget (€):</label>
          <input type="number" id="monthlyBudgetInput" step="1" min="0" class="w-20 border border-gray-300 rounded px-2 py-1 focus-ring">
          <button id="saveSettingsBtn" class="bg-violet-100 text-violet-700 text-xs font-bold px-3 py-1.5 rounded-md hover:bg-violet-200">Speichern</button>
        </div>
        <p id="settingsMsg" class="text-xs text-green-600"></p>
      </div>
    </div>

    <!-- Neuer Kauf -->
    <div class="bg-white p-6 rounded-xl shadow-lg">
      <h2 class="text-2xl font-semibold mb-4 border-b pb-3 text-gray-700">Neuen Kauf eintragen</h2>
      <div class="grid grid-cols-1 md:grid-cols-6 gap-4 items-start">
        <div class="md:col-span-2">
          <label class="block text-sm font-medium text-gray-700 mb-1">Spielname</label>
          <div class="flex gap-2">
            <input type="text" id="nameInput" placeholder="z.B. Arcs" class="w-full px-3 py-2 border border-gray-300 rounded-md focus-ring">
            <button type="button" id="bggSearchBtn" class="shrink-0 bg-violet-100 text-violet-700 text-sm font-semibold px-3 py-2 rounded-md hover:bg-violet-200 whitespace-nowrap">🎲 BGG</button>
          </div>
          <div id="bggResultsPanel" class="hidden mt-1 border border-gray-200 rounded-md bg-gray-50 max-h-56 overflow-y-auto"></div>
        </div>
        <div class="md:col-span-1">
          <label class="block text-sm font-medium text-gray-700 mb-1">Preis (€)</label>
          <input type="number" id="priceInput" step="0.01" min="0" placeholder="59.00" class="w-full px-3 py-2 border border-gray-300 rounded-md focus-ring">
        </div>
        <div class="md:col-span-1">
          <label class="block text-sm font-medium text-gray-700 mb-1">BGG-Rating</label>
          <input type="number" id="ratingInput" step="0.1" min="0" max="10" placeholder="von BGG" class="w-full px-3 py-2 border border-gray-300 rounded-md focus-ring">
        </div>
        <div class="md:col-span-1">
          <label class="block text-sm font-medium text-gray-700 mb-1">BGG-Komplexität</label>
          <input type="number" id="weightInput" step="0.1" min="0" max="5" placeholder="von BGG" class="w-full px-3 py-2 border border-gray-300 rounded-md focus-ring">
        </div>
        <div class="md:col-span-1">
          <label class="block text-sm font-medium text-gray-700 mb-1">Monat</label>
          <input type="month" id="monthInput" class="w-full px-3 py-2 border border-gray-300 rounded-md focus-ring">
        </div>
      </div>
      <div id="bggMatchPreview" class="hidden mt-3 flex gap-3 items-start p-3 border border-violet-200 bg-violet-50 rounded-md">
        <img id="bggMatchImg" class="w-14 h-14 object-contain rounded bg-white shrink-0 hidden" referrerpolicy="no-referrer">
        <div class="min-w-0">
          <p id="bggMatchTitle" class="font-semibold text-sm"></p>
          <p id="bggMatchBadges" class="text-xs text-gray-600 mt-1"></p>
        </div>
        <button type="button" id="bggMatchClear" class="ml-auto text-xs text-gray-400 hover:text-red-500">✕</button>
      </div>
      <div class="mt-3 flex flex-wrap items-center gap-6">
        <label class="flex items-center space-x-2 text-sm text-gray-700 cursor-pointer select-none">
          <input type="checkbox" id="kidsFriendlyToggle" class="rounded border-gray-300 text-violet-600">
          <span>Geeignet für Ann-Sophie (11) / Marie (8)</span>
        </label>
        <label class="flex items-center space-x-2 text-sm text-gray-600 cursor-pointer select-none">
          <input type="checkbox" id="noteToggle" class="rounded border-gray-300 text-violet-600">
          <span>Notiz hinzufügen</span>
        </label>
      </div>
      <input type="text" id="noteInput" placeholder="z.B. Convention-Kauf, 2. Edition, ..." class="mt-2 w-full px-3 py-2 border border-gray-300 rounded-md focus-ring hidden">

      <p id="ruleHint" class="text-sm mt-3 h-5"></p>
      <div class="mt-3 flex items-center justify-between">
        <p id="errorMessage" class="text-red-500 text-sm h-4"></p>
        <button id="addBtn" class="bg-violet-700 text-white font-bold py-2 px-6 rounded-md hover:bg-violet-800 focus-ring transition-transform hover:scale-105">
          Kauf eintragen
        </button>
      </div>
    </div>

    <!-- Käufe -->
    <div class="bg-white p-6 rounded-xl shadow-lg">
      <div class="flex justify-between items-center mb-4 border-b pb-3">
        <h2 class="text-2xl font-semibold text-gray-700">Käufe</h2>
        <button id="resetBtn" class="bg-gray-200 text-gray-700 font-bold py-2 px-4 rounded-md hover:bg-red-500 hover:text-white text-sm">
          Alle Käufe löschen
        </button>
      </div>
      <div id="purchaseList" class="space-y-2">
        <p class="text-gray-500">Noch keine Käufe eingetragen.</p>
      </div>
    </div>

    <!-- Monatsübersicht -->
    <div class="bg-white p-6 rounded-xl shadow-lg">
      <h2 class="text-2xl font-semibold mb-4 border-b pb-3 text-gray-700">Monatsübersicht</h2>
      <div id="monthTable" class="overflow-x-auto">
        <p class="text-gray-500">Noch keine Daten.</p>
      </div>
    </div>

  </main>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
import { getFirestore, collection, onSnapshot, addDoc, deleteDoc, doc, getDocs, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

document.addEventListener('DOMContentLoaded', async () => {
  const firebaseConfig = {
    apiKey: "AIzaSyBzIgSa17e0xADhmUAP29vMSqN1GRjOCFk",
    authDomain: "pizzaorder-fec41.firebaseapp.com",
    projectId: "pizzaorder-fec41",
    storageBucket: "pizzaorder-fec41.firebasestorage.app",
    messagingSenderId: "662851560067",
    appId: "1:662851560067:web:60b5843f159a11821671b6",
    measurementId: "G-MMFJKPWZML"
  };

  let db, auth, purchasesRef, settingsDocRef;

  // --- BGG API (gleicher Token wie im Spieleausleihe-Tool) ---
  const BGG_API_TOKEN = 'cb319383-f7f5-4e5b-bc40-78090627231e';
  let selectedBggMatch = null;

  function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

  async function callBggApi(endpoint, params = {}) {
    const url = new URL(`https://boardgamegeek.com/xmlapi2/${endpoint}`);
    Object.keys(params).forEach(k => url.searchParams.append(k, params[k]));
    const headers = new Headers();
    if (BGG_API_TOKEN) headers.append('Authorization', `Bearer ${BGG_API_TOKEN}`);
    let response = await fetch(url.toString(), { method: 'GET', headers });
    let retries = 0;
    while (response.status === 202 && retries < 5) {
      retries++;
      await sleep(1500);
      response = await fetch(url.toString(), { method: 'GET', headers });
    }
    if (!response.ok) throw new Error(`BGG HTTP Fehler ${response.status}`);
    const xmlText = await response.text();
    const xmlDoc = new DOMParser().parseFromString(xmlText, "application/xml");
    if (xmlDoc.querySelector("parsererror")) throw new Error("Fehler beim Parsen der BGG-Antwort.");
    return xmlDoc;
  }

  function parseBggDetails(xmlDoc) {
    const item = xmlDoc.querySelector('item');
    if (!item) return null;
    const getPrimaryName = () => {
      const names = item.querySelectorAll('name');
      for (const n of names) if (n.getAttribute('type') === 'primary') return n.getAttribute('value');
      return names.length > 0 ? names[0].getAttribute('value') : null;
    };
    const yearNode = item.querySelector('yearpublished');
    const ratingNode = item.querySelector('statistics ratings average');
    const weightNode = item.querySelector('statistics ratings averageweight');
    return {
      bggId: parseInt(item.getAttribute('id')) || null,
      bggName: getPrimaryName(),
      bggYear: yearNode ? yearNode.getAttribute('value') : null,
      bggImageUrl: item.querySelector('image')?.textContent || item.querySelector('thumbnail')?.textContent || null,
      bggRating: ratingNode ? parseFloat(ratingNode.getAttribute('value')) : null,
      bggWeight: weightNode ? parseFloat(weightNode.getAttribute('value')) : null
    };
  }

  try {
    const app = initializeApp(firebaseConfig);
    db = getFirestore(app);
    auth = getAuth(app);
    await signInAnonymously(auth);
    purchasesRef = collection(db, 'brettspiel_budget/andreas/kaeufe');
    settingsDocRef = doc(db, 'brettspiel_budget/andreas');
  } catch (e) {
    console.error(e);
    document.body.innerHTML = '<div class="text-center p-8 text-red-500">Fehler bei der Verbindung zur Datenbank.</div>';
    return;
  }

  // --- ELEMENTS ---
  const nameInput = document.getElementById('nameInput');
  const priceInput = document.getElementById('priceInput');
  const ratingInput = document.getElementById('ratingInput');
  const weightInput = document.getElementById('weightInput');
  const monthInput = document.getElementById('monthInput');
  const kidsFriendlyToggle = document.getElementById('kidsFriendlyToggle');
  const noteToggle = document.getElementById('noteToggle');
  const noteInput = document.getElementById('noteInput');
  const bggSearchBtn = document.getElementById('bggSearchBtn');
  const bggResultsPanel = document.getElementById('bggResultsPanel');
  const bggMatchPreview = document.getElementById('bggMatchPreview');
  const bggMatchImg = document.getElementById('bggMatchImg');
  const bggMatchTitle = document.getElementById('bggMatchTitle');
  const bggMatchBadges = document.getElementById('bggMatchBadges');
  const bggMatchClear = document.getElementById('bggMatchClear');
  const addBtn = document.getElementById('addBtn');
  const errorMessage = document.getElementById('errorMessage');
  const ruleHint = document.getElementById('ruleHint');
  const purchaseList = document.getElementById('purchaseList');
  const monthTable = document.getElementById('monthTable');
  const resetBtn = document.getElementById('resetBtn');
  const startMonthInput = document.getElementById('startMonthInput');
  const monthlyBudgetInput = document.getElementById('monthlyBudgetInput');
  const saveSettingsBtn = document.getElementById('saveSettingsBtn');
  const settingsMsg = document.getElementById('settingsMsg');
  const statTotalBudget = document.getElementById('statTotalBudget');
  const statTotalSpent = document.getElementById('statTotalSpent');
  const statCurrentMonth = document.getElementById('statCurrentMonth');
  const statBalance = document.getElementById('statBalance');

  const eur = n => n.toLocaleString('de-DE', { style: 'currency', currency: 'EUR' });
  const nowMonthStr = () => {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
  };
  monthInput.value = nowMonthStr();

  let settings = { startMonth: nowMonthStr(), monthlyBudget: 60 };
  let purchases = [];

  // --- SETTINGS ---
  async function loadSettings() {
    try {
      const snap = await getDoc(settingsDocRef);
      if (snap.exists()) {
        const data = snap.data();
        if (data.startMonth) settings.startMonth = data.startMonth;
        if (typeof data.monthlyBudget === 'number') settings.monthlyBudget = data.monthlyBudget;
      }
    } catch (e) {
      console.error(e);
      settingsMsg.textContent = `Einstellungen konnten nicht geladen werden (${e.code || e.message}).`;
      settingsMsg.className = 'text-xs text-red-600';
    }
    startMonthInput.value = settings.startMonth;
    monthlyBudgetInput.value = settings.monthlyBudget;
    render();
  }

  saveSettingsBtn.addEventListener('click', async () => {
    const sm = startMonthInput.value || nowMonthStr();
    const mb = parseFloat(monthlyBudgetInput.value);
    if (isNaN(mb) || mb < 0) { settingsMsg.textContent = 'Ungültiges Budget.'; settingsMsg.className = 'text-xs text-red-600'; return; }
    settings = { startMonth: sm, monthlyBudget: mb };
    try {
      await setDoc(settingsDocRef, settings, { merge: true });
      settingsMsg.textContent = 'Gespeichert.';
      settingsMsg.className = 'text-xs text-green-600';
      render();
    } catch (e) {
      console.error(e);
      settingsMsg.textContent = `Fehler beim Speichern (${e.code || e.message || e}).`;
      settingsMsg.className = 'text-xs text-red-600';
    }
  });

  // --- RULE HINT ---
  function evaluateRule() {
    const rating = parseFloat(ratingInput.value);
    const weight = parseFloat(weightInput.value);
    const kidsOk = kidsFriendlyToggle.checked;
    let msgs = [];
    let ok = true;
    if (!isNaN(rating)) {
      if (rating < 7.8) { msgs.push(`Rating ${rating.toFixed(1)} liegt unter deiner Grenze von 7,8.`); ok = false; }
      else if (rating < 8.0) { msgs.push(`Rating ${rating.toFixed(1)} ok, aber unter dem Idealwert 8,0.`); }
      else { msgs.push(`Rating ${rating.toFixed(1)} ✓`); }
    }
    if (!kidsOk) {
      if (!isNaN(weight)) {
        if (weight < 3.4) { msgs.push(`Komplexität ${weight.toFixed(1)} ist weder kindgerecht noch ≥3,4.`); ok = false; }
        else { msgs.push(`Komplexität ${weight.toFixed(1)} ✓`); }
      }
    } else {
      msgs.push('Kindgerecht ✓');
    }
    if (msgs.length === 0) { ruleHint.textContent = ''; return; }
    ruleHint.textContent = msgs.join('  ·  ');
    ruleHint.className = 'text-sm mt-3 h-5 ' + (ok ? 'text-green-600' : 'text-amber-600');
  }
  [ratingInput, weightInput, kidsFriendlyToggle].forEach(el => el.addEventListener('input', evaluateRule));
  kidsFriendlyToggle.addEventListener('change', evaluateRule);

  noteToggle.addEventListener('change', () => {
    noteInput.classList.toggle('hidden', !noteToggle.checked);
    if (noteToggle.checked) noteInput.focus(); else noteInput.value = '';
  });

  // --- BGG-SUCHE ---
  function showBggMatch(match) {
    selectedBggMatch = match;
    if (match.bggImageUrl) { bggMatchImg.src = match.bggImageUrl; bggMatchImg.classList.remove('hidden'); }
    else { bggMatchImg.classList.add('hidden'); }
    bggMatchTitle.textContent = match.bggName + (match.bggYear ? ` (${match.bggYear})` : '');
    let badges = [];
    if (typeof match.bggRating === 'number' && !isNaN(match.bggRating)) badges.push(`⭐ ${match.bggRating.toFixed(1)}`);
    if (typeof match.bggWeight === 'number' && !isNaN(match.bggWeight)) badges.push(`⚙ ${match.bggWeight.toFixed(1)}`);
    bggMatchBadges.textContent = badges.join('   ');
    bggMatchPreview.classList.remove('hidden');
    if (!nameInput.value.trim()) nameInput.value = match.bggName || '';
    if (typeof match.bggRating === 'number' && !isNaN(match.bggRating)) ratingInput.value = match.bggRating.toFixed(2);
    if (typeof match.bggWeight === 'number' && !isNaN(match.bggWeight)) weightInput.value = match.bggWeight.toFixed(2);
    evaluateRule();
  }

  bggMatchClear.addEventListener('click', () => {
    selectedBggMatch = null;
    bggMatchPreview.classList.add('hidden');
    bggMatchImg.classList.add('hidden');
  });

  bggSearchBtn.addEventListener('click', async () => {
    const query = nameInput.value.trim();
    if (!query) { errorMessage.textContent = 'Bitte zuerst einen Spielnamen (oder Suchbegriff) eingeben.'; return; }
    errorMessage.textContent = '';
    bggResultsPanel.classList.remove('hidden');
    bggResultsPanel.innerHTML = '<p class="p-3 text-sm text-gray-500">Suche auf BGG…</p>';
    try {
      const searchXml = await callBggApi('search', { query, type: 'boardgame' });
      const items = Array.from(searchXml.querySelectorAll('item')).slice(0, 12);
      if (items.length === 0) {
        bggResultsPanel.innerHTML = '<p class="p-3 text-sm text-gray-500">Keine Treffer auf BGG gefunden. Werte können manuell eingetragen werden.</p>';
        return;
      }
      bggResultsPanel.innerHTML = '';
      items.forEach(item => {
        const id = item.getAttribute('id');
        const nameNode = item.querySelector('name');
        const name = nameNode ? nameNode.getAttribute('value') : '(ohne Titel)';
        const yearNode = item.querySelector('yearpublished');
        const year = yearNode ? yearNode.getAttribute('value') : '';
        const row = document.createElement('div');
        row.className = 'flex justify-between gap-2 px-3 py-2 text-sm cursor-pointer hover:bg-violet-100 border-b border-gray-100 last:border-b-0';
        row.innerHTML = `<span>${name.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}</span><span class="text-gray-400 text-xs shrink-0">${year}</span>`;
        row.dataset.id = id;
        row.addEventListener('click', async () => {
          bggResultsPanel.innerHTML = '<p class="p-3 text-sm text-gray-500">Lade Details…</p>';
          try {
            const detailXml = await callBggApi('thing', { id, stats: 1 });
            const match = parseBggDetails(detailXml);
            if (match) showBggMatch(match);
            bggResultsPanel.classList.add('hidden');
            bggResultsPanel.innerHTML = '';
          } catch (e) {
            console.error(e);
            bggResultsPanel.innerHTML = '<p class="p-3 text-sm text-red-500">Details konnten nicht geladen werden.</p>';
          }
        });
        bggResultsPanel.appendChild(row);
      });
    } catch (e) {
      console.error(e);
      bggResultsPanel.innerHTML = '<p class="p-3 text-sm text-red-500">Suche fehlgeschlagen (evtl. Netzwerk/CORS). Werte können manuell eingetragen werden.</p>';
    }
  });

  // --- ADD PURCHASE ---
  async function addPurchase() {
    const name = nameInput.value.trim();
    const price = parseFloat(priceInput.value);
    const rating = parseFloat(ratingInput.value);
    const weight = parseFloat(weightInput.value);
    const month = monthInput.value || nowMonthStr();
    const kidsFriendly = kidsFriendlyToggle.checked;
    const note = noteToggle.checked ? noteInput.value.trim() : '';

    if (!name || isNaN(price) || price <= 0 || !month) {
      errorMessage.textContent = 'Bitte Name, Preis und Monat korrekt ausfüllen.';
      return;
    }
    errorMessage.textContent = '';

    const data = { name, price, month, kidsFriendly, createdAt: new Date().toISOString() };
    if (!isNaN(rating)) data.rating = rating;
    if (!isNaN(weight)) data.weight = weight;
    if (note) data.note = note;
    if (selectedBggMatch?.bggId) data.bggId = selectedBggMatch.bggId;
    if (selectedBggMatch?.bggImageUrl) data.bggImageUrl = selectedBggMatch.bggImageUrl;

    try {
      await addDoc(purchasesRef, data);
      nameInput.value = ''; priceInput.value = ''; ratingInput.value = ''; weightInput.value = '';
      kidsFriendlyToggle.checked = false; noteToggle.checked = false; noteInput.value = ''; noteInput.classList.add('hidden');
      ruleHint.textContent = '';
      selectedBggMatch = null; bggMatchPreview.classList.add('hidden'); bggMatchImg.classList.add('hidden');
      bggResultsPanel.classList.add('hidden'); bggResultsPanel.innerHTML = '';
      monthInput.value = nowMonthStr();
      nameInput.focus();
    } catch (e) {
      console.error(e);
      errorMessage.textContent = `Fehler beim Speichern (${e.code || e.message || e}).`;
    }
  }
  addBtn.addEventListener('click', addPurchase);
  [nameInput, priceInput, ratingInput, weightInput].forEach(el => el.addEventListener('keypress', e => e.key === 'Enter' && addPurchase()));

  async function deletePurchase(id) {
    if (!confirm('Diesen Kauf wirklich löschen?')) return;
    try { await deleteDoc(doc(purchasesRef, id)); } catch (e) { console.error(e); }
  }

  resetBtn.addEventListener('click', async () => {
    if (!confirm('Wirklich ALLE Käufe unwiderruflich löschen?')) return;
    try {
      const snap = await getDocs(purchasesRef);
      await Promise.all(snap.docs.map(d => deleteDoc(d.ref)));
    } catch (e) { console.error(e); }
  });

  // --- LISTEN ---
  onSnapshot(purchasesRef, snap => {
    purchases = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  }, err => {
    console.error(err);
    purchaseList.innerHTML = `<p class="text-red-500">Fehler beim Laden der Käufe (${err.code || err.message}). Vermutlich fehlende Firestore-Berechtigung für den Pfad brettspiel_budget/andreas/kaeufe.</p>`;
  });

  // --- RENDER ---
  function monthsBetween(startMonth, endMonth) {
    const [sy, sm] = startMonth.split('-').map(Number);
    const [ey, em] = endMonth.split('-').map(Number);
    return (ey - sy) * 12 + (em - sm) + 1;
  }
  function monthLabel(m) {
    const [y, mo] = m.split('-').map(Number);
    return new Date(y, mo - 1, 1).toLocaleDateString('de-DE', { month: 'long', year: 'numeric' });
  }
  function addMonths(m, n) {
    const [y, mo] = m.split('-').map(Number);
    const d = new Date(y, mo - 1 + n, 1);
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
  }

  function render() {
    const current = nowMonthStr();
    const nMonths = Math.max(1, monthsBetween(settings.startMonth, current));
    const totalBudget = nMonths * settings.monthlyBudget;
    const totalSpent = purchases.reduce((s, p) => s + (p.price || 0), 0);
    const balance = totalBudget - totalSpent;

    statTotalBudget.textContent = eur(totalBudget);
    statTotalSpent.textContent = eur(totalSpent);
    statCurrentMonth.textContent = monthLabel(current);
    statBalance.textContent = eur(balance);
    statBalance.className = 'text-3xl font-extrabold ' + (balance >= 0 ? 'text-green-700' : 'text-red-600');

    // Purchase list, newest first
    if (purchases.length === 0) {
      purchaseList.innerHTML = '<p class="text-gray-500">Noch keine Käufe eingetragen.</p>';
    } else {
      const sorted = [...purchases].sort((a, b) => (b.month + (b.createdAt || '')).localeCompare(a.month + (a.createdAt || '')));
      purchaseList.innerHTML = '';
      const ul = document.createElement('ul');
      ul.className = 'divide-y divide-gray-200';
      sorted.forEach(p => {
        const li = document.createElement('li');
        li.className = 'py-2 flex justify-between items-center gap-3';
        let badges = '';
        if (typeof p.rating === 'number') {
          const cls = p.rating >= 8.0 ? 'badge-ok' : p.rating >= 7.8 ? 'badge-warn' : 'badge-bad';
          badges += `<span class="text-xs font-semibold px-2 py-0.5 rounded-full ${cls} mr-1">★ ${p.rating.toFixed(1)}</span>`;
        }
        if (p.kidsFriendly) {
          badges += `<span class="text-xs font-semibold px-2 py-0.5 rounded-full badge-ok mr-1">Kids</span>`;
        } else if (typeof p.weight === 'number') {
          const cls = p.weight >= 3.4 ? 'badge-ok' : 'badge-bad';
          badges += `<span class="text-xs font-semibold px-2 py-0.5 rounded-full ${cls} mr-1">⚙ ${p.weight.toFixed(1)}</span>`;
        }
        const noteHtml = p.note ? ` <span class="text-xs italic text-gray-500">(${p.note})</span>` : '';
        const imgHtml = p.bggImageUrl ? `<img src="${p.bggImageUrl}" referrerpolicy="no-referrer" class="w-10 h-10 object-contain rounded bg-gray-100 shrink-0">` : '';
        li.innerHTML = `
          <div class="flex items-center gap-3 min-w-0">
            ${imgHtml}
            <div class="min-w-0">
              <span class="font-semibold">${p.name}</span>
              <span class="text-xs text-gray-500 ml-2">${monthLabel(p.month)}</span>
              <div class="mt-1">${badges}${noteHtml}</div>
            </div>
          </div>
          <div class="flex items-center gap-3 shrink-0">
            <span class="font-bold text-violet-700">${eur(p.price)}</span>
            <button class="text-xs bg-gray-200 hover:bg-red-200 text-gray-700 px-2 py-1 rounded-md" data-id="${p.id}">Löschen</button>
          </div>`;
        li.querySelector('button').addEventListener('click', () => deletePurchase(p.id));
        ul.appendChild(li);
      });
      purchaseList.appendChild(ul);
    }

    // Month table
    const rows = [];
    let running = 0;
    for (let i = 0; i < nMonths; i++) {
      const m = addMonths(settings.startMonth, i);
      const spent = purchases.filter(p => p.month === m).reduce((s, p) => s + (p.price || 0), 0);
      running += settings.monthlyBudget - spent;
      rows.push({ m, spent, running });
    }
    rows.reverse();
    let html = `<table class="w-full text-sm">
      <thead><tr class="text-left text-gray-500 border-b">
        <th class="py-2">Monat</th><th class="py-2 text-right">Budget</th><th class="py-2 text-right">Ausgegeben</th><th class="py-2 text-right">Saldo am Monatsende</th>
      </tr></thead><tbody>`;
    rows.forEach(r => {
      const balCls = r.running >= 0 ? 'text-green-700' : 'text-red-600';
      html += `<tr class="border-b border-gray-100">
        <td class="py-2">${monthLabel(r.m)}</td>
        <td class="py-2 text-right">${eur(settings.monthlyBudget)}</td>
        <td class="py-2 text-right">${eur(r.spent)}</td>
        <td class="py-2 text-right font-bold ${balCls}">${eur(r.running)}</td>
      </tr>`;
    });
    html += '</tbody></table>';
    monthTable.innerHTML = html;
  }

  loadSettings();
});
</script>
</body>
</html>
